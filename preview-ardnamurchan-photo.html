<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ardnamurchan photo comparison · CMWS</title><link rel="stylesheet" href="/assets/site.css"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><style>
main{padding:48px 0 64px}h1{font-size:clamp(32px,4vw,48px)}.intro{font-size:17px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:32px 0}figure{margin:0;min-width:0}figcaption{font-size:15px;font-weight:700;margin-bottom:12px}.comparison img{display:block;width:100%;height:auto;border:1px solid var(--line)}.brighter{filter:brightness(1.08)}.large{max-width:1000px;margin:40px auto 0}.large img{display:block;width:100%;height:auto}.toggle{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 16px}button{font:inherit;cursor:pointer;background:transparent;color:var(--ink)}button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}h2{font-size:28px}.quiet{font-size:14px}

</style></head><body><main><div class="shell"><p class="kicker">CMWS · Photo preview</p><h1>Ardnamurchan group photo</h1><p class="intro">The original alongside a subtly brighter version. The framing is identical.</p><div class="comparison"><figure><figcaption>Original</figcaption><img src="/assets/Ardnamurchan%20selection%20251115%20%7BIMG_6634%20-J.Srb%7D%20HiRes.jpg" alt="Original CMWS cask-selection group photograph with Antonia Bruce" decoding="async"></figure><figure><figcaption>Subtly brighter</figcaption><img class="brighter" src="/assets/Ardnamurchan%20selection%20251115%20%7BIMG_6634%20-J.Srb%7D%20HiRes.jpg" alt="Brighter display of the same CMWS cask-selection group photograph" decoding="async"></figure></div><section class="large" aria-labelledby="large-title"><h2 id="large-title">Compare at a larger size</h2><div class="toggle" role="group" aria-label="Photo brightness"><button class="button" type="button" data-bright="false" aria-pressed="true">Original</button><button class="button" type="button" data-bright="true" aria-pressed="false">Subtly brighter</button></div><img id="large-photo" src="/assets/Ardnamurchan%20selection%20251115%20%7BIMG_6634%20-J.Srb%7D%20HiRes.jpg" alt="CMWS cask-selection group with Antonia Bruce at Whisky Life Prague"><p id="current-version" class="quiet" aria-live="polite">Showing: Original</p></section><p><a class="text-link" href="/bottlings.html#ardnamurchan-2110">Back to the Ardnamurchan section →</a></p></div></main><script>
const photo=document.getElementById('large-photo'),status=document.getElementById('current-version');document.querySelectorAll('[data-bright]').forEach(button=>button.addEventListener('click',()=>{const bright=button.dataset.bright==='true';photo.classList.toggle('brighter',bright);document.querySelectorAll('[data-bright]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));status.textContent='Showing: '+(bright?'Subtly brighter':'Original');}));
</script></body></html>
